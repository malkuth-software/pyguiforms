# Builds and tests the platform wheels (tools/build_wheel.py), each from the
# C ABI library gui_forms CI uploads per platform as gui-forms-abi-<platform>
# (gui_forms tools/package_abi_library.py). The library comes from the most
# recent gui_forms run that has those artifacts, or from the run named when
# dispatching. While gui_forms has published none, the wheel jobs are
# skipped and the workflow stays green. Nothing is published: the wheels are
# this run's artifacts.
name: Wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gui_forms_run:
        description: The gui_forms workflow run whose gui-forms-abi-* artifacts to use (default the latest)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  GUI_FORMS_REPOSITORY: malkuth-software/gui_forms

jobs:
  library:
    name: Find the gui_forms C ABI library
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GUI_FORMS_READ_TOKEN || github.token }}
          REQUESTED: ${{ inputs.gui_forms_run }}
        run: |
          if [ -n "$REQUESTED" ]; then
            echo "run_id=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The newest unexpired linux-x64 artifact names the run; the other
          # platforms' artifacts come from the same run.
          run_id=$(gh api "repos/$GUI_FORMS_REPOSITORY/actions/artifacts?name=gui-forms-abi-linux-x64&per_page=20" \
            --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty' || true)
          if [ -z "$run_id" ]; then
            echo "::notice::gui_forms has published no gui-forms-abi artifact yet; the wheel jobs are skipped"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  wheel:
    name: Wheel (${{ matrix.platform }})
    needs: library
    if: needs.library.outputs.run_id != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The oldest and newest CPython the wheel serves; 3.14 stays the default.
      - uses: actions/setup-python@v5
        id: oldest
        with:
          python-version: "3.10"
      - uses: actions/setup-python@v5
        id: newest
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: gui-forms-abi-${{ matrix.platform }}
          path: abi-library
          repository: ${{ env.GUI_FORMS_REPOSITORY }}
          run-id: ${{ needs.library.outputs.run_id }}
          github-token: ${{ secrets.GUI_FORMS_READ_TOKEN || github.token }}
      - name: Build the wheel
        run: python tools/build_wheel.py --abi-archive abi-library/gui-forms-abi-*.zip --out dist
      # The manylinux check: auditwheel retags the linux_* wheel with the
      # oldest manylinux policy the library meets, grafting in any shared
      # library outside the policy, and fails if it can meet none.
      - name: Make the wheel manylinux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet "auditwheel>=6.1,<7" "patchelf>=0.17,<0.18"
          python -m auditwheel repair dist/*.whl -w wheelhouse
          python -m auditwheel show wheelhouse/*.whl
          rm dist/*.whl
          mv wheelhouse/*.whl dist/
          python tools/build_wheel.py --check dist/*.whl
      - name: Install the window tests' display
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb
      - name: Test the installed wheel on CPython 3.10 and 3.14
        env:
          OLDEST: ${{ steps.oldest.outputs.python-path }}
          NEWEST: ${{ steps.newest.outputs.python-path }}
        run: |
          command="python tools/test_installed_wheel.py dist/pyguiforms-*.whl --python $OLDEST --python $NEWEST"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24" $command
          else
            $command
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pyguiforms-wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
